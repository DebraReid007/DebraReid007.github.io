<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vintage Rochester rum route map</title>
  <desc id="desc">A warm illustrated map scene with river linework, rum glass, citrus, rattan, and tropical botanical accents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6e2b7"/>
      <stop offset="0.46" stop-color="#c98945"/>
      <stop offset="1" stop-color="#172e28"/>
    </linearGradient>
    <radialGradient id="lamp" cx="28%" cy="26%" r="70%">
      <stop offset="0" stop-color="#ffe5a8" stop-opacity=".8"/>
      <stop offset=".42" stop-color="#cc7d32" stop-opacity=".38"/>
      <stop offset="1" stop-color="#1b1713" stop-opacity=".9"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#254a42" stroke-width="1" opacity=".28"/>
      <path d="M 14 0 L 14 56 M 42 0 L 42 56 M 0 28 L 56 28" fill="none" stroke="#f2c67a" stroke-width=".7" opacity=".16"/>
    </pattern>
    <pattern id="rattan" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="34" height="34" fill="#2b1d15"/>
      <path d="M0 8h34M0 25h34" stroke="#8c5a31" stroke-width="4" opacity=".45"/>
      <path d="M8 0v34M25 0v34" stroke="#d29a55" stroke-width="2" opacity=".28"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#1d1812"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#paper)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#lamp)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#grid)" opacity=".84"/>
  <rect x="0" y="0" width="1600" height="900" filter="url(#grain)" opacity=".38"/>

  <path d="M1028 -90 C1160 70 1030 182 1168 302 C1325 439 1204 574 1348 744 C1400 806 1418 865 1402 942" fill="none" stroke="#7ec1c4" stroke-width="44" opacity=".34"/>
  <path d="M1016 -96 C1140 72 1012 180 1148 300 C1302 438 1182 575 1328 746 C1374 800 1394 858 1382 932" fill="none" stroke="#173d32" stroke-width="14" opacity=".72"/>
  <path d="M1092 214 h168 M1108 238 h142 M1125 262 h104" stroke="#f6e4bb" stroke-width="7" opacity=".42" stroke-linecap="round"/>

  <path d="M0 687 C144 628 302 642 470 604 C647 565 790 468 980 493 C1180 519 1326 652 1600 604 L1600 900 L0 900 Z" fill="#241710" opacity=".7"/>
  <rect x="0" y="742" width="1600" height="158" fill="url(#rattan)" opacity=".58"/>

  <g transform="translate(1055 536)">
    <ellipse cx="150" cy="258" rx="216" ry="31" fill="#0d0b09" opacity=".35"/>
    <path d="M80 52 C130 18 221 18 273 54 L240 262 C205 291 145 291 112 262 Z" fill="#21130d" opacity=".7"/>
    <path d="M98 62 C141 38 213 37 255 62 L231 249 C202 269 150 271 123 248 Z" fill="#c6792c" opacity=".76"/>
    <path d="M109 83 C147 63 204 62 244 82 L232 150 C196 166 154 166 119 150 Z" fill="#f7bd62" opacity=".56"/>
    <ellipse cx="176" cy="61" rx="93" ry="30" fill="#f7ca7f" opacity=".5"/>
    <ellipse cx="176" cy="60" rx="75" ry="18" fill="#2a1410" opacity=".55"/>
    <path d="M134 30 C152 7 194 7 216 31" fill="none" stroke="#f6e4bb" stroke-width="4" opacity=".5"/>
  </g>

  <g transform="translate(1240 205)">
    <circle cx="86" cy="86" r="82" fill="#d85a47" opacity=".9"/>
    <circle cx="86" cy="86" r="44" fill="#f6e4bb" opacity=".9"/>
    <path d="M86 18 C102 49 127 62 159 65 C128 83 112 105 103 139 C84 111 60 96 27 92 C59 76 76 52 86 18Z" fill="#173d32" opacity=".83"/>
    <circle cx="86" cy="86" r="17" fill="#c6792c"/>
  </g>

  <g transform="translate(820 645) rotate(-12)">
    <path d="M0 78 C60 15 132 0 218 35 C178 96 95 124 0 78Z" fill="#173d32"/>
    <path d="M37 70 C86 46 134 42 191 38" stroke="#93c9a7" stroke-width="5" opacity=".6" stroke-linecap="round"/>
    <path d="M16 82 C69 84 126 73 204 38" stroke="#f6e4bb" stroke-width="3" opacity=".35" stroke-linecap="round"/>
  </g>
  <g transform="translate(1330 660) rotate(16)">
    <path d="M0 82 C64 12 139 0 228 38 C184 103 98 132 0 82Z" fill="#225143"/>
    <path d="M42 74 C90 49 145 43 204 40" stroke="#94c492" stroke-width="5" opacity=".55" stroke-linecap="round"/>
  </g>

  <g transform="translate(678 474)" opacity=".58">
    <circle cx="0" cy="0" r="86" fill="none" stroke="#f6e4bb" stroke-width="4"/>
    <path d="M0 -76 L15 -14 L76 0 L15 14 L0 76 L-15 14 L-76 0 L-15 -14 Z" fill="#d85a47" opacity=".74"/>
    <circle cx="0" cy="0" r="10" fill="#f6e4bb"/>
  </g>

  <path d="M-40 0 H1600 V900 H0 Z" fill="#000" opacity=".05"/>
  <rect x="0" y="0" width="720" height="900" fill="#16120e" opacity=".46"/>
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#1d1812" stroke-width="24" opacity=".45"/>
</svg>
